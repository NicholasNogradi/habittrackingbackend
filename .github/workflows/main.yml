name: Lint OpenAPI Spec + Run Collection

on:
  push:
    branches:
      - 'chore/*'
      - 'feature/*'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-spec:
    name: Compare Feature Spec With Main
    runs-on: ubuntu-latest
    outputs:
      breaking_changes: ${{ steps.diff.outputs.breaking_changes }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          # In pull requests, check out the feature branch itself rather
          # than GitHub's synthetic merge commit.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Extract main branch OpenAPI spec
        run: |
          mkdir -p .openapi-diff/main
          git show origin/main:postman/specs/index.yaml \
            > .openapi-diff/main/index.yaml

      - name: Compare main with feature branch
        id: diff
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            openapitools/openapi-diff:2.1.7 \
            --fail-on-incompatible \
            /workspace/.openapi-diff/main/index.yaml \
            /workspace/postman/specs/index.yaml \
            | tee openapi-diff-report.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo "breaking_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "breaking_changes=false" >> "$GITHUB_OUTPUT"
          fi
          exit $exit_code

  flag-breaking-changes:
    name: Flag Breaking API Changes on PR
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: diff-spec
    permissions:
      issues: write
    steps:
      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const diffFailed = '${{ needs.diff-spec.result }}' === 'failure';
            const breakingChanges = '${{ needs.diff-spec.outputs.breaking_changes }}' === 'true';
            const body = (diffFailed || breakingChanges)
              ? [
                  '### 🚨 Breaking API change risk detected',
                  '',
                  'The OpenAPI spec diff between this branch and `main` found incompatible changes.',
                  'Review the **Compare Feature Spec With Main** job logs before merging — existing API consumers could break.'
                ].join('\n')
              : '### ✅ No breaking API changes detected\n\nThe OpenAPI spec is backward compatible with `main`.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  lint-spec:
    name: Lint OpenAPI/Swagger Spec
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: diff-spec
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Verify Postman CLI version
        run: postman --version

      - name: Login to Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Lint OpenAPI/Swagger Spec
        run: postman spec lint "postman/specs/index.yaml" --workspace-id "11858b98-e156-4275-9db9-1ce675bfc729" --report-events
  
  run-collection:
    name: Run Postman Collection
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: 
      - lint-spec
      - diff-spec
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'

      - name: Install Dependencies
        run: npm ci

      - name: Start the application
        run: npm start &

      - name: Wait for the application to be ready
        run: |
          echo "Waiting for the application to be ready..."
          SERVER_READY=false
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Application is ready!"
              SERVER_READY=true
              break
            fi
            echo "Waiting for the application to be ready... ($i/30)"
            sleep 2
          done

          if [ "$SERVER_READY" = false ]; then
            echo "Server failed to start"
            exit 1
          fi

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      
      - name: Run Smoke tests
        run: |
          postman collection run "55289350-1e41dc11-8477-412e-af26-d4487bb3984e" -e "55289350-7472042b-71b7-42b0-beb5-defc52098080"

      - name: Run Negative tests
        run: |
          postman collection run "55289350-27eae2c3-fa49-48e2-a534-142f89121a40" -e "55289350-7472042b-71b7-42b0-beb5-defc52098080"
      
      - name: Run Contract tests
        run: |
          postman collection run "55289350-b862964b-1b8d-4d6a-88fc-d3f01d57dad4" -e "55289350-7472042b-71b7-42b0-beb5-defc52098080"

  pr_comment:
    name: Comment on Pull Request
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: run-collection
    permissions:
      issues: write
    steps:
      - name: Add PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Automated tests have completed successfully. The Postman collection has been run against the application, and all tests passed. ✅'
            })
