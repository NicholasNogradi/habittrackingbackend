$kind: http-request
description: 'Generated from cURL: curl -X GET "{{baseUrl}}/categories?limit=5" -H "Accept: application/json" -H "Authorization: Bearer {{contractAccessToken}}"'
url: "{{baseUrl}}/categories?limit=5"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{contractAccessToken}}
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Paginated categories response matches contract schema", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data").that.is.an("array");
          pm.expect(json).to.have.property("meta").that.is.an("object");
          pm.expect(json.meta).to.have.property("total").that.is.a("number");
          pm.expect(json.meta).to.have.property("limit").that.is.a("number");
          json.data.forEach(function(category, index) {
              pm.expect(category, `category[${index}] must have id`).to.have.property("id").that.is.a("string");
              pm.expect(category, `category[${index}] must have name`).to.have.property("name").that.is.a("string");
              pm.expect(category, `category[${index}] must have createdAt`).to.have.property("createdAt").that.is.a("string");
              // color should be a hex color if present
              if (category.color) {
                  pm.expect(category.color).to.match(/^#[0-9A-Fa-f]{6}$/);
              }
          });
      });
    language: text/javascript
settings: {}
order: 6000
