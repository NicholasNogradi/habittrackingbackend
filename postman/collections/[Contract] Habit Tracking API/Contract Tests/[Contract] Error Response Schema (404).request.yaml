$kind: http-request
description: 'Generated from cURL: curl -X GET {{baseUrl}}/habits/00000000-0000-0000-0000-000000000000 -H "Accept: application/json" -H "Authorization: Bearer {{contractAccessToken}}"'
url: "{{baseUrl}}/habits/00000000-0000-0000-0000-000000000000"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{contractAccessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Error response matches standard error contract schema", function () {
          const json = pm.response.json();
          // Standard error envelope
          pm.expect(json).to.have.property("error").that.is.a("string");
          pm.expect(json.error).to.not.be.empty;
          // Optional but common fields
          if (json.code !== undefined) {
              pm.expect(json.code).to.be.a("string");
          }
          if (json.message !== undefined) {
              pm.expect(json.message).to.be.a("string");
          }
      });
      pm.test("Error response does not leak internal details", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("stack");
          pm.expect(json).to.not.have.property("trace");
          pm.expect(json).to.not.have.property("sql");
      });
    language: text/javascript
settings: {}
order: 9000
