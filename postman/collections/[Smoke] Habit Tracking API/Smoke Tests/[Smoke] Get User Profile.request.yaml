$kind: http-request
description: 'Generated from cURL: curl -X GET {{baseUrl}}/users/me -H "Accept: application/json" -H "Authorization: Bearer {{smokeAccessToken}}"'
url: "{{baseUrl}}/users/me"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{smokeAccessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response body is not empty", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
      pm.test("Response has user id", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
      });
      pm.test("Response has email field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("email");
      });
    language: text/javascript
settings: {}
order: 3000
