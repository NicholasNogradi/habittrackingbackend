$kind: http-request
description: "Generated from cURL: curl -X POST {{baseUrl}}/habits -H \"Content-Type: application/json\" -H \"Accept: application/json\" -H \"Authorization: Bearer {{smokeAccessToken}}\" -d '{\"name\":\"Smoke Test Habit\",\"frequency\":\"daily\",\"description\":\"Created by smoke test\",\"targetCount\":1}'"
url: "{{baseUrl}}/habits"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{smokeAccessToken}}
body:
  type: json
  content: '{"name":"Smoke Test Habit","frequency":"daily","description":"Created by smoke test","targetCount":1}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response has habit id", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("string").and.not.empty;
      });
      pm.test("Habit name matches request", function () {
          const json = pm.response.json();
          pm.expect(json.name).to.eql("Smoke Test Habit");
      });
      // Store for downstream smoke tests
      if (pm.response.code === 201) {
          pm.collectionVariables.set("smokeHabitId", pm.response.json().id);
      }
    language: text/javascript
settings: {}
order: 5000
