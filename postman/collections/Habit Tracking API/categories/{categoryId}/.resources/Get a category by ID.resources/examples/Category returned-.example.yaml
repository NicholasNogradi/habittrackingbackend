$kind: http-example
name: Category returned.
request:
  url: "{{baseUrl}}/categories/:categoryId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: categoryId
      value: 1c3b4d12-89ab-4def-0123-456789abcdef
      description: Unique identifier of the category.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    ETag: ""
  body:
    type: json
    content: |-
      {
        "id": "a056d6d4-e7a3-bc4a-6a35-7a076249b06c",
        "name": "Health & Fitness",
        "createdAt": "1951-09-16T10:02:19.675Z",
        "updatedAt": "2009-05-01T01:46:10.921Z",
        "description": "string",
        "color": "#4CAF50",
        "icon": "dumbbell",
        "habitCount": 1020
      }
order: 1000
