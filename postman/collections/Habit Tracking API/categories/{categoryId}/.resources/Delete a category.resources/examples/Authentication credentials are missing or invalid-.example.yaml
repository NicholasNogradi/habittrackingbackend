$kind: http-example
name: Authentication credentials are missing or invalid.
request:
  url: "{{baseUrl}}/categories/:categoryId"
  method: DELETE
  headers:
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: categoryId
      value: 1c3b4d12-89ab-4def-0123-456789abcdef
      description: Unique identifier of the category.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/problem+json
    - key: WWW-Authenticate
      value: Bearer realm="habittrack", error="invalid_token"
      disabled: false
      description: Authentication challenge.
  body:
    type: json
    content: |-
      {
        "type": "https://errors.habittrack.io/validation-error",
        "title": "Validation Error",
        "status": 422,
        "detail": "The field 'frequency' is required.",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736",
        "instance": "http://IwFqwHJEZijjYrEefwFDFRgS.vxzoU0bRgflFQ3kyIjOae7rpevkxjVvutsWv",
        "errors": [
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          },
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          }
        ]
      }
order: 2000
