$kind: http-example
name: Category deleted.
request:
  url: "{{baseUrl}}/categories/:categoryId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: categoryId
      value: 1c3b4d12-89ab-4def-0123-456789abcdef
      description: Unique identifier of the category.
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
