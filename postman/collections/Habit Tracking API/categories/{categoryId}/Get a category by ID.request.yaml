$kind: http-request
url: "{{baseUrl}}/categories/:categoryId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: categoryId
    value: 1c3b4d12-89ab-4def-0123-456789abcdef
    description: Unique identifier of the category.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
examples: ./.resources/Get a category by ID.resources/examples
order: 1000
