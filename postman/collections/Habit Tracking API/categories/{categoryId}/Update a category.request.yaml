$kind: http-request
url: "{{baseUrl}}/categories/:categoryId"
method: PATCH
headers:
  - key: If-Match
    value: '"d41d8cd98f00b204e9800998ecf8427e"'
    description: |
      ETag value for optimistic concurrency control. If the resource has
      changed since the ETag was retrieved, the server returns **412**.
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: categoryId
    value: 1c3b4d12-89ab-4def-0123-456789abcdef
    description: Unique identifier of the category.
body:
  type: json
  content: |-
    {
      "name": "string",
      "description": "string",
      "color": "#109Ab7",
      "icon": "string"
    }
settings: {}
examples: ./.resources/Update a category.resources/examples
order: 2000
