$kind: http-example
name: Paginated list of categories.
request:
  url: "{{baseUrl}}/categories?limit=20&cursor=eyJpZCI6IjEyMyIsInRzIjoiMjAyNS0wMS0wMVQwMDowMDowMFoifQ=="
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
