$kind: http-request
description: 'Generated from cURL: curl -X GET "{{baseUrl}}/habits/00000000-0000-0000-0000-000000000000" -H "Accept: application/json" -H "Authorization: Bearer {{accessToken}}"'
url: "{{baseUrl}}/habits/00000000-0000-0000-0000-000000000000"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 for non-existent habit', function () {
          pm.response.to.have.status(404);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })

      pm.test('Error message references not found', function () {
          const body = pm.response.text().toLowerCase();
          pm.expect(body).to.satisfy(function (b) {
              return b.includes('not found') || b.includes('does not exist') || b.includes('404');
          });
      })
    language: text/javascript
order: 4000
