$kind: http-request
description: 'Generated from cURL: curl -X POST {{baseUrl}}/auth/token -H "Content-Type: application/x-www-form-urlencoded" -H "Accept: application/json" --data-urlencode "grant_type=password"'
url: "{{baseUrl}}/auth/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    grant_type: password
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 for missing credentials', function () {
          pm.response.to.have.status(400);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })

      pm.test('Error message is descriptive', function () {
          const json = pm.response.json();
          pm.expect(json.error).to.be.a('string').and.not.empty;
      })
    language: text/javascript
order: 1000
