$kind: http-request
description: 'Generated from cURL: curl -X POST {{baseUrl}}/auth/token -H "Content-Type: application/x-www-form-urlencoded" -H "Accept: application/json" --data-urlencode "grant_type=password" --data-urlencode "username=invalid@example.com" --data-urlencode "password=wrongpassword"'
url: "{{baseUrl}}/auth/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    grant_type: password
    username: invalid@example.com
    password: wrongpassword
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 for invalid credentials', function () {
          pm.response.to.have.status(401);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })

      pm.test('Response does not contain access_token', function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property('access_token');
      })
    language: text/javascript
order: 2000
