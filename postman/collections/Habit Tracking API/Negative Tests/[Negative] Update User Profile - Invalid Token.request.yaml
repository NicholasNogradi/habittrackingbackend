$kind: http-request
description: "Generated from cURL: curl -X PATCH {{baseUrl}}/users/me -H \"Content-Type: application/json\" -H \"Accept: application/json\" -H \"Authorization: Bearer {{invalidToken}}\" -d '{\"displayName\":\"Hacker\"}'"
url: "{{baseUrl}}/users/me"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{invalidToken}}
body:
  type: json
  content: '{"displayName":"Hacker"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 for invalid token', function () {
          pm.response.to.have.status(401);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })

      pm.test('Profile was not updated', function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property('displayName');
      })
    language: text/javascript
order: 10000
