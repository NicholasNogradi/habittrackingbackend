$kind: http-example
name: Authentication credentials are missing or invalid.
request:
  url: "{{baseUrl}}/habits/:habitId/checkins?limit=20&cursor=eyJpZCI6IjEyMyIsInRzIjoiMjAyNS0wMS0wMVQwMDowMDowMFoifQ==&from=2025-01-01&to=2025-03-31&status=completed"
  method: GET
  headers:
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: limit
      value: "20"
      description: Maximum number of items to return per page (1–100).
    - key: cursor
      value: eyJpZCI6IjEyMyIsInRzIjoiMjAyNS0wMS0wMVQwMDowMDowMFoifQ==
      description: Opaque pagination cursor returned by the previous page response.
    - key: from
      value: 2025-01-01
      description: Filter check-ins on or after this date (ISO 8601 date).
    - key: to
      value: 2025-03-31
      description: Filter check-ins on or before this date (ISO 8601 date).
    - key: status
      value: completed
      description: Filter by completion status.
  pathVariables:
    - key: habitId
      value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Unique identifier of the habit.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/problem+json
    - key: WWW-Authenticate
      value: Bearer realm="habittrack", error="invalid_token"
      disabled: false
      description: Authentication challenge.
  body:
    type: json
    content: |-
      {
        "type": "https://errors.habittrack.io/validation-error",
        "title": "Validation Error",
        "status": 422,
        "detail": "The field 'frequency' is required.",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736",
        "instance": "http://IwFqwHJEZijjYrEefwFDFRgS.vxzoU0bRgflFQ3kyIjOae7rpevkxjVvutsWv",
        "errors": [
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          },
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          }
        ]
      }
order: 3000
