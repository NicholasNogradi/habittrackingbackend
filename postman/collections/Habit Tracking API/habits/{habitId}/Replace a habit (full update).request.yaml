$kind: http-request
url: "{{baseUrl}}/habits/:habitId"
method: PUT
headers:
  - key: If-Match
    value: '"d41d8cd98f00b204e9800998ecf8427e"'
    description: |
      ETag value for optimistic concurrency control. If the resource has
      changed since the ETag was retrieved, the server returns **412**.
    $type: string
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: habitId
    value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    description: Unique identifier of the habit.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "string",
      "frequency": "daily",
      "description": "string",
      "categoryId": "20791657-041b-3f57-9a5f-d0a965a9025a",
      "color": "#C492Ab",
      "icon": "string",
      "targetDays": [
        "sunday",
        "friday"
      ],
      "targetCount": 1,
      "unit": "string",
      "targetValue": 6080.998707762963,
      "startDate": "1965-07-26",
      "endDate": "2024-01-16"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200
        },
        "description": {
          "type": "string",
          "maxLength": 1000
        },
        "categoryId": {
          "type": "string",
          "format": "uuid"
        },
        "color": {
          "type": "string",
          "pattern": "^#[0-9A-Fa-f]{6}$"
        },
        "icon": {
          "type": "string",
          "maxLength": 50
        },
        "frequency": {
          "type": "string",
          "enum": [
            "daily",
            "weekly",
            "custom"
          ],
          "description": "How often the habit should be completed."
        },
        "targetDays": {
          "type": "array",
          "items": {
            "type": "string"
          }
        },
        "targetCount": {
          "type": "integer",
          "minimum": 1,
          "format": "int32"
        },
        "unit": {
          "type": "string",
          "maxLength": 50
        },
        "targetValue": {
          "type": "number",
          "format": "double"
        },
        "startDate": {
          "type": "string",
          "format": "date"
        },
        "endDate": {
          "type": "string",
          "format": "date"
        }
      },
      "required": [
        "name",
        "frequency"
      ]
    }
examples: ./.resources/Replace a habit (full update).resources/examples
order: 5000
