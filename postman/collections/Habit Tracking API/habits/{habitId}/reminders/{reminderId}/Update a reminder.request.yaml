$kind: http-request
url: "{{baseUrl}}/habits/:habitId/reminders/:reminderId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: habitId
    value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    description: Unique identifier of the habit.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: reminderId
    value: d4e5f6a7-b8c9-0123-4567-89abcdef0123
    description: Unique identifier of the reminder.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "time": "10:06",
      "daysOfWeek": [
        "wednesday",
        "tuesday"
      ],
      "channel": "sms",
      "message": "string",
      "isEnabled": true
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "time": {
          "type": "string",
          "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$"
        },
        "daysOfWeek": {
          "type": "array",
          "items": {
            "type": "string"
          }
        },
        "channel": {
          "type": "string",
          "enum": [
            "push",
            "email",
            "sms"
          ],
          "description": "Delivery channel for the reminder."
        },
        "message": {
          "type": "string",
          "maxLength": 200
        },
        "isEnabled": {
          "type": "boolean"
        }
      }
    }
examples: ./.resources/Update a reminder.resources/examples
order: 2000
