$kind: http-example
name: Authentication credentials are missing or invalid.
request:
  url: "{{baseUrl}}/habits/:habitId/reminders/:reminderId"
  method: GET
  headers:
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: habitId
      value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Unique identifier of the habit.
    - key: reminderId
      value: d4e5f6a7-b8c9-0123-4567-89abcdef0123
      description: Unique identifier of the reminder.
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/problem+json
    - key: WWW-Authenticate
      value: Bearer realm="habittrack", error="invalid_token"
      disabled: false
      description: Authentication challenge.
  body:
    type: json
    content: |-
      {
        "type": "https://errors.habittrack.io/validation-error",
        "title": "Validation Error",
        "status": 422,
        "detail": "The field 'frequency' is required.",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736",
        "instance": "http://IwFqwHJEZijjYrEefwFDFRgS.vxzoU0bRgflFQ3kyIjOae7rpevkxjVvutsWv",
        "errors": [
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          },
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          }
        ]
      }
order: 2000
