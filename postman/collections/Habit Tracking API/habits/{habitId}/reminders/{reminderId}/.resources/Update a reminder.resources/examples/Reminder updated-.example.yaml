$kind: http-example
name: Reminder updated.
request:
  url: "{{baseUrl}}/habits/:habitId/reminders/:reminderId"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: habitId
      value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Unique identifier of the habit.
    - key: reminderId
      value: d4e5f6a7-b8c9-0123-4567-89abcdef0123
      description: Unique identifier of the reminder.
  body:
    type: json
    content: |-
      {
        "time": "10:06",
        "daysOfWeek": [
          "wednesday",
          "tuesday"
        ],
        "channel": "sms",
        "message": "string",
        "isEnabled": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "6c1964f9-82a0-7019-be7a-4fcab1f11ae8",
        "habitId": "6ed1c301-9d65-7474-7b68-aa7a1bf5a6b7",
        "time": "07:30",
        "channel": "sms",
        "isEnabled": true,
        "createdAt": "2012-05-05T20:52:18.917Z",
        "updatedAt": "1970-02-11T06:34:36.758Z",
        "daysOfWeek": [
          "sunday",
          "monday"
        ],
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "time": {
            "type": "string",
            "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
            "example": "07:30",
            "description": "Local time of day to fire the reminder (HH:mm, 24-hour)."
          },
          "daysOfWeek": {
            "type": "array",
            "description": "Days on which this reminder fires. Omit for daily reminders.",
            "items": {
              "type": "string"
            }
          },
          "channel": {
            "type": "string",
            "enum": [
              "push",
              "email",
              "sms"
            ],
            "description": "Delivery channel for the reminder."
          },
          "message": {
            "type": "string",
            "maxLength": 200,
            "description": "Custom reminder message (falls back to habit name if omitted)."
          },
          "isEnabled": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "habitId",
          "time",
          "channel",
          "isEnabled",
          "createdAt",
          "updatedAt"
        ]
      }
order: 1000
