$kind: http-example
name: Reminder deleted.
request:
  url: "{{baseUrl}}/habits/:habitId/reminders/:reminderId"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: habitId
      value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      description: Unique identifier of the habit.
    - key: reminderId
      value: d4e5f6a7-b8c9-0123-4567-89abcdef0123
      description: Unique identifier of the reminder.
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
