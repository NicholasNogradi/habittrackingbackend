$kind: http-example
name: Rate limit exceeded.
request:
  url: "{{baseUrl}}/habits?limit=20&cursor=eyJpZCI6IjEyMyIsInRzIjoiMjAyNS0wMS0wMVQwMDowMDowMFoifQ==&categoryId=caf5bb04-4900-a698-218c-ecf5619a92a7&status=active&frequency=daily&sort=-createdAt"
  method: GET
  headers:
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: limit
      value: "20"
      description: Maximum number of items to return per page (1–100).
    - key: cursor
      value: eyJpZCI6IjEyMyIsInRzIjoiMjAyNS0wMS0wMVQwMDowMDowMFoifQ==
      description: Opaque pagination cursor returned by the previous page response.
    - key: categoryId
      value: caf5bb04-4900-a698-218c-ecf5619a92a7
      description: Filter habits by category.
    - key: status
      value: active
      description: Filter by habit status.
    - key: frequency
      value: daily
      description: Filter by recurrence frequency.
    - key: sort
      value: -createdAt
      description: Field to sort by (prefix with `-` for descending).
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Content-Type
      value: application/problem+json
    - key: Retry-After
      value: "30"
      disabled: false
      description: Seconds to wait before retrying.
    - key: X-RateLimit-Limit
      value: ""
      disabled: false
      description: ""
    - key: X-RateLimit-Remaining
      value: ""
      disabled: false
      description: ""
    - key: X-RateLimit-Reset
      value: ""
      disabled: false
      description: ""
  body:
    type: json
    content: |-
      {
        "type": "https://errors.habittrack.io/validation-error",
        "title": "Validation Error",
        "status": 422,
        "detail": "The field 'frequency' is required.",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736",
        "instance": "http://IwFqwHJEZijjYrEefwFDFRgS.vxzoU0bRgflFQ3kyIjOae7rpevkxjVvutsWv",
        "errors": [
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          },
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          }
        ]
      }
order: 4000
