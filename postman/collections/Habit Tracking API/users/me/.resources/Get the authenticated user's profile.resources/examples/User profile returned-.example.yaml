$kind: http-example
name: User profile returned.
request:
  url: "{{baseUrl}}/users/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: ""
      value: ""
      disabled: true
