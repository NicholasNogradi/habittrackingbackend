$kind: http-example
name: |-
  The `If-Match` ETag does not match the current resource version.
  Fetch the latest resource and retry.
request:
  url: "{{baseUrl}}/users/me"
  method: PATCH
  headers:
    - key: If-Match
      value: '"d41d8cd98f00b204e9800998ecf8427e"'
      description: |
        ETag value for optimistic concurrency control. If the resource has
        changed since the ETag was retrieved, the server returns **412**.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "displayName": "string",
        "avatarUrl": "http://xvUTxlmJVwapf.hnGJpjg,sy3ELX1CqBmWdjhcJKSgpDj.0ebGUtwHxeA0f",
        "timezone": "string",
        "locale": "string",
        "weekStartDay": "monday"
      }
response:
  statusCode: 412
  statusText: Precondition Failed
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "https://errors.habittrack.io/validation-error",
        "title": "Validation Error",
        "status": 422,
        "detail": "The field 'frequency' is required.",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736",
        "instance": "http://IwFqwHJEZijjYrEefwFDFRgS.vxzoU0bRgflFQ3kyIjOae7rpevkxjVvutsWv",
        "errors": [
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          },
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          }
        ]
      }
order: 5000
