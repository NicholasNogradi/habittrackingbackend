$kind: http-example
name: Profile updated.
request:
  url: "{{baseUrl}}/users/me"
  method: PATCH
  headers:
    - key: If-Match
      value: '"d41d8cd98f00b204e9800998ecf8427e"'
      description: |
        ETag value for optimistic concurrency control. If the resource has
        changed since the ETag was retrieved, the server returns **412**.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "displayName": "string",
        "avatarUrl": "http://xvUTxlmJVwapf.hnGJpjg,sy3ELX1CqBmWdjhcJKSgpDj.0ebGUtwHxeA0f",
        "timezone": "string",
        "locale": "string",
        "weekStartDay": "monday"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    ETag: ""
  body:
    type: json
    content: |-
      {
        "id": "99b0dc91-d79b-9c2a-32cb-2f300ec6e3c6",
        "email": "ZNNg0g5sTec@jSXt.iu",
        "displayName": "string",
        "createdAt": "1988-07-16T19:14:06.943Z",
        "updatedAt": "1956-12-17T19:18:08.760Z",
        "avatarUrl": "http://TLxTppqVIPCRlX.eybaA.EK-cSMDWYzAn3STDGwfM0T2ngNxd4p9P1pM2BMum95o",
        "timezone": "America/New_York",
        "locale": "en-US",
        "weekStartDay": "monday"
      }
order: 1000
