$kind: http-request
description: Invalidate a refresh token, ending the session.
url: "{{baseUrl}}/auth/token/revoke"
method: POST
headers:
  Content-Type: application/json
  Accept: application/problem+json
body:
  type: json
  content: |-
    {
      "refresh_token": "string"
    }
settings: {}
examples: ./.resources/Revoke a refresh token.resources/examples
order: 1000
