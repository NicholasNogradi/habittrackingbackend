$kind: http-example
name: New access token issued.
request:
  url: "{{baseUrl}}/auth/token/refresh"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "refresh_token": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Cache-Control: ""
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "token_type": "Bearer",
        "expires_in": 3600,
        "refresh_token": "string",
        "scope": "habits:read habits:write checkins:write"
      }
order: 1000
