$kind: http-example
name: Token issued successfully.
request:
  url: "{{baseUrl}}/auth/token"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: urlencoded
    content:
      - key: grant_type
        value: authorization_code
        description: OAuth 2.0 grant type.
      - key: username
        value: AOuXzI@IYtRfrRGjlj.wo
        description: Required for `password` grant.
      - key: password
        value: string
        description: Required for `password` grant.
      - key: code
        value: string
        description: Required for `authorization_code` grant.
      - key: redirect_uri
        value: https://tYoNomIKIzUqiDhAtvVCwQCkQdyI.jhjp41XCGUV+jLvvWYZS4SEXY9A,L1zMQCWQYgmqbLcqIREQw8k8g3v-rA
        description: Required for `authorization_code` grant.
      - key: client_id
        value: string
      - key: client_secret
        value: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
    Cache-Control: ""
  body:
    type: json
    content: |-
      {
        "access_token": "string",
        "token_type": "Bearer",
        "expires_in": 3600,
        "refresh_token": "string",
        "scope": "habits:read habits:write checkins:write"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "access_token": {
            "type": "string",
            "description": "JWT access token."
          },
          "token_type": {
            "type": "string",
            "enum": [
              "Bearer"
            ]
          },
          "expires_in": {
            "type": "integer",
            "example": 3600,
            "description": "Lifetime of the access token in seconds.",
            "format": "int32"
          },
          "refresh_token": {
            "type": "string",
            "description": "Opaque refresh token (only returned for `password` and `authorization_code` grants)."
          },
          "scope": {
            "type": "string",
            "example": "habits:read habits:write checkins:write",
            "description": "Space-delimited list of scopes granted."
          }
        },
        "required": [
          "access_token",
          "token_type",
          "expires_in"
        ]
      }
order: 1000
