$kind: http-example
name: Authentication credentials are missing or invalid.
request:
  url: "{{baseUrl}}/auth/token"
  method: POST
  headers:
    - key: Content-Type
      value: application/x-www-form-urlencoded
    - key: Accept
      value: application/problem+json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: urlencoded
    content:
      - key: grant_type
        value: authorization_code
        description: OAuth 2.0 grant type.
      - key: username
        value: AOuXzI@IYtRfrRGjlj.wo
        description: Required for `password` grant.
      - key: password
        value: string
        description: Required for `password` grant.
      - key: code
        value: string
        description: Required for `authorization_code` grant.
      - key: redirect_uri
        value: https://tYoNomIKIzUqiDhAtvVCwQCkQdyI.jhjp41XCGUV+jLvvWYZS4SEXY9A,L1zMQCWQYgmqbLcqIREQw8k8g3v-rA
        description: Required for `authorization_code` grant.
      - key: client_id
        value: string
      - key: client_secret
        value: string
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/problem+json
    - key: WWW-Authenticate
      value: Bearer realm="habittrack", error="invalid_token"
      disabled: false
      description: Authentication challenge.
      $type: |-
        {
          "type": "object",
          "properties": {
            "value": {
              "type": "string",
              "example": "Bearer realm=\"habittrack\", error=\"invalid_token\""
            }
          }
        }
  body:
    type: json
    content: |-
      {
        "type": "https://errors.habittrack.io/validation-error",
        "title": "Validation Error",
        "status": 422,
        "detail": "The field 'frequency' is required.",
        "traceId": "4bf92f3577b34da6a3ce929d0e0e4736",
        "instance": "http://IwFqwHJEZijjYrEefwFDFRgS.vxzoU0bRgflFQ3kyIjOae7rpevkxjVvutsWv",
        "errors": [
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          },
          {
            "field": "/frequency",
            "message": "must be one of [daily, weekly, custom]",
            "code": "ENUM_VIOLATION"
          }
        ]
      }
    $type: |-
      {
        "description": "RFC 7807-compliant Problem Details object for error responses.\n",
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "example": "https://errors.habittrack.io/validation-error",
            "description": "URI reference identifying the problem type.",
            "format": "uri"
          },
          "title": {
            "type": "string",
            "example": "Validation Error",
            "description": "Short, human-readable summary."
          },
          "status": {
            "type": "integer",
            "example": 422,
            "description": "HTTP status code.",
            "format": "int32"
          },
          "detail": {
            "type": "string",
            "example": "The field 'frequency' is required.",
            "description": "Human-readable explanation of this specific occurrence."
          },
          "instance": {
            "type": "string",
            "description": "URI reference identifying this specific occurrence.",
            "format": "uri"
          },
          "traceId": {
            "type": "string",
            "example": "4bf92f3577b34da6a3ce929d0e0e4736",
            "description": "Distributed trace ID for support and debugging."
          },
          "errors": {
            "type": "array",
            "description": "Field-level validation errors.",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string",
                  "example": "/frequency",
                  "description": "JSON Pointer to the offending field."
                },
                "message": {
                  "type": "string",
                  "example": "must be one of [daily, weekly, custom]"
                },
                "code": {
                  "type": "string",
                  "example": "ENUM_VIOLATION"
                }
              },
              "required": [
                "field",
                "message",
                "code"
              ]
            }
          }
        },
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "traceId"
        ]
      }
order: 3000
