$kind: http-request
description: "Generated from cURL: curl -X POST {{baseUrl}}/habits/{{contractHabitId}}/checkins -H \"Content-Type: application/json\" -H \"Accept: application/json\" -H \"Authorization: Bearer {{contractAccessToken}}\" -d '{\"date\":\"2025-01-15\",\"status\":\"completed\",\"note\":\"Contract test check-in\"}'"
url: "{{baseUrl}}/habits/{{contractHabitId}}/checkins"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{contractAccessToken}}
body:
  type: json
  content: '{"date":"2025-01-15","status":"completed","note":"Contract test check-in"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Check-in response matches contract schema", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id").that.is.a("string");
          pm.expect(json).to.have.property("habitId").that.is.a("string");
          pm.expect(json).to.have.property("date").that.is.a("string");
          pm.expect(json).to.have.property("status").that.is.a("string");
          pm.expect(json).to.have.property("createdAt").that.is.a("string");
          // status must be valid enum
          pm.expect(["completed","skipped","partial"]).to.include(json.status);
          // date must be ISO date format
          pm.expect(json.date).to.match(/^\d{4}-\d{2}-\d{2}$/);
          // habitId must match the requested habit
          pm.expect(json.habitId).to.eql(pm.collectionVariables.get("contractHabitId"));
      });
    language: text/javascript
order: 7000
