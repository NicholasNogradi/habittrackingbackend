$kind: http-request
description: 'Generated from cURL: curl -X GET {{baseUrl}}/habits/{{contractHabitId}} -H "Accept: application/json" -H "Authorization: Bearer {{contractAccessToken}}"'
url: "{{baseUrl}}/habits/{{contractHabitId}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{contractAccessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Habit object matches contract schema", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id").that.is.a("string");
          pm.expect(json).to.have.property("name").that.is.a("string");
          pm.expect(json).to.have.property("frequency").that.is.a("string");
          pm.expect(json).to.have.property("status").that.is.a("string");
          pm.expect(json).to.have.property("createdAt").that.is.a("string");
          pm.expect(json).to.have.property("updatedAt").that.is.a("string");
          pm.expect(json).to.have.property("userId").that.is.a("string");
          pm.expect(json).to.have.property("targetCount").that.is.a("number");
          // Enum validations
          pm.expect(["daily","weekly","monthly","custom"]).to.include(json.frequency);
          pm.expect(["active","paused","archived"]).to.include(json.status);
          // targetCount must be positive
          pm.expect(json.targetCount).to.be.at.least(1);
      });
      pm.test("ETag header is present for caching", function () {
          pm.expect(pm.response.headers.has("ETag")).to.be.true;
      });
    language: text/javascript
order: 5000
