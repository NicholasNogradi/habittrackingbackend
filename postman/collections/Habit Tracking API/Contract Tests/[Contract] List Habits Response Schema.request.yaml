$kind: http-request
description: 'Generated from cURL: curl -X GET "{{baseUrl}}/habits?limit=5" -H "Accept: application/json" -H "Authorization: Bearer {{contractAccessToken}}"'
url: "{{baseUrl}}/habits?limit=5"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{contractAccessToken}}
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Paginated list response matches contract schema", function () {
          const json = pm.response.json();
          // Top-level structure
          pm.expect(json).to.have.property("data").that.is.an("array");
          pm.expect(json).to.have.property("meta").that.is.an("object");
          // Meta fields
          pm.expect(json.meta).to.have.property("total").that.is.a("number");
          pm.expect(json.meta).to.have.property("limit").that.is.a("number");
          // Validate each habit item schema
          json.data.forEach(function(habit, index) {
              pm.expect(habit, `habit[${index}] must have id`).to.have.property("id").that.is.a("string");
              pm.expect(habit, `habit[${index}] must have name`).to.have.property("name").that.is.a("string");
              pm.expect(habit, `habit[${index}] must have frequency`).to.have.property("frequency").that.is.a("string");
              pm.expect(habit, `habit[${index}] must have status`).to.have.property("status").that.is.a("string");
              pm.expect(habit, `habit[${index}] must have createdAt`).to.have.property("createdAt").that.is.a("string");
              // frequency must be one of the valid enum values
              pm.expect(["daily","weekly","monthly","custom"]).to.include(habit.frequency);
              // status must be one of the valid enum values
              pm.expect(["active","paused","archived"]).to.include(habit.status);
          });
      });
    language: text/javascript
order: 3000
