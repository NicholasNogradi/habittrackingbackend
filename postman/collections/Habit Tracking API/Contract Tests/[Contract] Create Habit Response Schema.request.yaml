$kind: http-request
description: "Generated from cURL: curl -X POST {{baseUrl}}/habits -H \"Content-Type: application/json\" -H \"Accept: application/json\" -H \"Authorization: Bearer {{contractAccessToken}}\" -d '{\"name\":\"Contract Test Habit\",\"frequency\":\"daily\",\"description\":\"Validating contract schema\",\"targetCount\":1}'"
url: "{{baseUrl}}/habits"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{contractAccessToken}}
body:
  type: json
  content: '{"name":"Contract Test Habit","frequency":"daily","description":"Validating contract schema","targetCount":1}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
      pm.test("Created habit response matches contract schema", function () {
          const json = pm.response.json();
          // Required fields and types
          pm.expect(json).to.have.property("id").that.is.a("string");
          pm.expect(json).to.have.property("name").that.is.a("string");
          pm.expect(json).to.have.property("frequency").that.is.a("string");
          pm.expect(json).to.have.property("status").that.is.a("string");
          pm.expect(json).to.have.property("createdAt").that.is.a("string");
          pm.expect(json).to.have.property("updatedAt").that.is.a("string");
          pm.expect(json).to.have.property("userId").that.is.a("string");
          // Enum validations
          pm.expect(["daily","weekly","monthly","custom"]).to.include(json.frequency);
          pm.expect(["active","paused","archived"]).to.include(json.status);
          // ID should be UUID format
          pm.expect(json.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i);
          // Response name matches request
          pm.expect(json.name).to.eql("Contract Test Habit");
      });
      pm.test("Location header is present", function () {
          pm.expect(pm.response.headers.has("Location")).to.be.true;
      });
      if (pm.response.code === 201) {
          pm.collectionVariables.set("contractHabitId", pm.response.json().id);
      }
    language: text/javascript
order: 4000
