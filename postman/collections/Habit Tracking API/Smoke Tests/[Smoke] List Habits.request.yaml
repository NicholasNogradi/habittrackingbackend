$kind: http-request
description: 'Generated from cURL: curl -X GET "{{baseUrl}}/habits?limit=5" -H "Accept: application/json" -H "Authorization: Bearer {{smokeAccessToken}}"'
url: "{{baseUrl}}/habits?limit=5"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{smokeAccessToken}}
queryParams:
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response body is not empty", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });
      pm.test("Response has data array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("array");
      });
      pm.test("Response has pagination metadata", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("meta");
      });
    language: text/javascript
order: 3000
