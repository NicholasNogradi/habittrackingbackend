$kind: http-request
description: 'Generated from cURL: curl -X GET {{baseUrl}}/habits/:habitId -H "Accept: application/json" -H "Authorization: Bearer {{smokeAccessToken}}"'
url: "{{baseUrl}}/habits/:habitId"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{smokeAccessToken}}
pathVariables:
  habitId: "{{smokeHabitId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response has correct habit id", function () {
          const json = pm.response.json();
          pm.expect(json.id).to.eql(pm.collectionVariables.get("smokeHabitId"));
      });
      pm.test("Response has name field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("name");
      });
      pm.test("Response has frequency field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("frequency");
      });
    language: text/javascript
order: 5000
