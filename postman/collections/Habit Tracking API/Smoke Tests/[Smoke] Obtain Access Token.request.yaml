$kind: http-request
description: 'Generated from cURL: curl -X POST {{baseUrl}}/auth/token -H "Content-Type: application/x-www-form-urlencoded" -H "Accept: application/json" --data-urlencode "grant_type=password" --data-urlencode "username={{username}}" --data-urlencode "password={{password}}"'
url: "{{baseUrl}}/auth/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
  Accept: application/json
body:
  type: urlencoded
  content:
    grant_type: password
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response has access_token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("access_token");
          pm.expect(json.access_token).to.be.a("string").and.not.empty;
      });
      pm.test("Response has token_type", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("token_type");
      });
      // Store token for downstream smoke tests
      if (pm.response.code === 200) {
          pm.collectionVariables.set("smokeAccessToken", pm.response.json().access_token);
      }
    language: text/javascript
order: 1000
