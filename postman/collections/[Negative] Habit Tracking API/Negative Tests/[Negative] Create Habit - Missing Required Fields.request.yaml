$kind: http-request
description: "Generated from cURL: curl -X POST {{baseUrl}}/habits -H \"Content-Type: application/json\" -H \"Accept: application/json\" -H \"Authorization: Bearer {{accessToken}}\" -d '{}'"
url: "{{baseUrl}}/habits"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 for missing required fields', function () {
          pm.response.to.have.status(400);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })

      pm.test('Error response does not return a created resource', function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property('id');
      })
    language: text/javascript
settings: {}
order: 5000
