$kind: http-request
description: 'Generated from cURL: curl -X GET "{{baseUrl}}/habits/not-a-valid-uuid/checkins/also-not-valid" -H "Accept: application/json" -H "Authorization: Bearer {{accessToken}}"'
url: "{{baseUrl}}/habits/not-a-valid-uuid/checkins/also-not-valid"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 or 404 for invalid ID format', function () {
          pm.expect(pm.response.code).to.be.oneOf([
              400,
              404
          ]);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response body is not empty', function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })
    language: text/javascript
settings: {}
order: 8000
