$kind: http-request
description: 'Generated from cURL: curl -X DELETE "{{baseUrl}}/habits/00000000-0000-0000-0000-000000000000" -H "Accept: application/json" -H "Authorization: Bearer {{accessToken}}"'
url: "{{baseUrl}}/habits/00000000-0000-0000-0000-000000000000"
method: DELETE
headers:
  Accept: application/json
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404 for non-existent habit', function () {
          pm.response.to.have.status(404);
      })

      pm.test('Response time is under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      })

      pm.test('Error response has error field', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('error');
      })
    language: text/javascript
settings: {}
order: 9000
